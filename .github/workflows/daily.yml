name: Daily regression

# Started every day by cron-job.org through the GitHub API (workflow_dispatch), because the GitHub
# scheduler often runs late or not at all. The `schedule` below is the backup: it fires 45 minutes later
# and does nothing when the run for today has already started.
#
# cron-job.org job:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/daily.yml/dispatches
#   Headers: Authorization: Bearer <fine-grained token with "Actions: write">
#            Accept: application/vnd.github+json
#   Body:    {"ref":"main"}
#
# Daily time: 06:30 Nepal time (UTC+5:45) = 00:45 UTC. Set the cron-job.org job to 06:30 Asia/Kathmandu.
# The backup below fires 45 minutes later (01:30 UTC = 07:15 Nepal) and the watchdog (watchdog.yml)
# 90 minutes later (02:15 UTC = 08:00 Nepal). GitHub cron is always in UTC.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *' # backup: 07:15 Nepal time

concurrency:
  group: daily-regression
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
  CUSTOMER_PHONE: ${{ secrets.CUSTOMER_PHONE }}
  CUSTOMER_OTP: ${{ secrets.CUSTOMER_OTP }}
  CUSTOMER_DIAL_CODE: ${{ vars.CUSTOMER_DIAL_CODE || secrets.CUSTOMER_DIAL_CODE }}
  CUSTOMER2_PHONE: ${{ secrets.CUSTOMER2_PHONE }}
  CUSTOMER2_OTP: ${{ secrets.CUSTOMER2_OTP }}

jobs:
  regression:
    runs-on: ubuntu-latest
    # Playwright stops itself after 40 minutes (globalTimeout) and still writes its reports.
    # The extra 20 minutes cover install, cleanup and the reporting steps.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip the backup when the run for today already started
        id: guard
        if: github.event_name == 'schedule'
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          earlier=$(gh run list --workflow daily.yml --event workflow_dispatch --created ">=$since" --json databaseId --jq length)
          if [ "$earlier" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Backup schedule: the run for today was already started by cron-job.org. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> Started by the **backup schedule**: cron-job.org did not trigger the run today." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.guard.outputs.skip != 'true'

      - name: Typecheck
        if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Delete old test data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: npm run test:cleanup

      - name: UI and API tests
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: Say so when the run was cancelled or timed out
        if: cancelled()
        run: echo "## Run cancelled or timed out before it finished. The table above covers the tests that did run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-daily
          path: |
            playwright-report/
            test-results/failures.md
          retention-days: 14
          if-no-files-found: ignore

      # Opens one issue (or comments on the open one) when the run failed, passed only after retries,
      # was cancelled, or a known bug started passing. Closes it when the run is clean again.
      - name: Open or update the GitHub issue
        if: always() && steps.guard.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create daily-regression --color B60205 --description "Daily regression needs attention" 2>/dev/null || true
          open_issue=$(gh issue list --label daily-regression --state open --json number --jq '.[0].number // empty')
          body=$(mktemp)
          echo "Run: $RUN_URL (job status: **$JOB_STATUS**)" > "$body"
          echo >> "$body"
          if [ -f test-results/failures.md ]; then
            head -c 60000 test-results/failures.md >> "$body"
          elif [ "$JOB_STATUS" != "success" ]; then
            echo "The job did not succeed and no test results were written. It probably failed outside the tests: install, typecheck, timeout or cancellation." >> "$body"
          else
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body "Clean run: $RUN_URL. Closing."
              gh issue close "$open_issue"
            fi
            exit 0
          fi
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file "$body"
          else
            gh issue create --title "Daily regression needs attention" --label daily-regression --body-file "$body"
          fi
