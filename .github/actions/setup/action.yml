name: Set up the test suite
description: Installs Node, the dependencies and the Playwright browsers.
inputs:
  browsers:
    description: Browsers to install (space separated)
    default: chromium
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
      shell: bash
    - run: npx playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
